<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פניני יהודית | הבית הדיגיטלי</title>
    <!-- השורה החדשה שמוסיפה את הלוגו לכרטיסייה בדפדפן -->
    <link rel="icon" type="image/png" href="images/GGG.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <img src="images/GGG.png" class="site-logo">
            <button id="theme-toggle" class="theme-switch" title="מצב לילה/יום">
                <div class="sun-icon">☀️</div>
                <div class="moon-icon">🌙</div>
            </button>
        </div>
        <nav class="header-bottom">
            <a href="#">צפייה</a>
            <a href="#">לימוד ותוכן</a>
            <a href="#">תפילה ותהילים</a>
            <a href="#">לוח יהודי</a>
        </nav>
    </header>

    <!-- אזור הסטיקרים המתחלפים -->
    <div class="sticker-banner">
        <img id="rotating-sticker" src="" alt="סטיקר">
    </div>

    <main>
        <section class="hero">
            <!-- האזור של הטקסט היומי -->
            <div id="daily-info-box" class="today-info">טוען עדכון יומי...</div>
            
            <!-- אזור הסרטונים שייטען אוטומטית מקובץ ה-JSON -->
            <div id="video-gallery">
                <!-- הסרטונים יופיעו כאן -->
            </div>
        </section>
    </main>

    <footer>
        <p>זמנים באדיבות Hebcal | טקסטים באדיבות Sefaria</p>
        <p>© כל הזכויות שמורות לפניני יהודית</p>
    </footer>

    <script>
        // קוד כפתור מצב לילה/יום
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // מנוע ששואב את הטקסט היומי מקובץ הטקסט
        fetch('daily_text.txt')
            .then(response => response.text())
            .then(text => {
                if(text.trim() !== "") {
                    document.getElementById('daily-info-box').innerText = text;
                }
            })
            .catch(error => console.error('שגיאה בטעינת הטקסט היומי:', error));

        // מנוע ששואב את הסטיקרים מקובץ ה-JSON
        fetch('stickers.json')
            .then(response => response.json())
            .then(stickers => {
                const stickerImg = document.getElementById("rotating-sticker");
                if (stickers.length > 0) stickerImg.src = stickers[0];
                if (stickers.length > 1) {
                    let currentStickerIndex = 0;
                    setInterval(() => {
                        stickerImg.classList.add("fade-out");
                        setTimeout(() => {
                            currentStickerIndex = (currentStickerIndex + 1) % stickers.length;
                            stickerImg.src = stickers[currentStickerIndex];
                            stickerImg.classList.remove("fade-out");
                        }, 500); 
                    }, 7000);
                }
            })
            .catch(error => console.error('שגיאה בטעינת הסטיקרים:', error));

        // מנוע ששואב את הסרטונים מקובץ ה-videos.json
        fetch('videos.json')
            .then(response => response.json())
            .then(videos => {
                const gallery = document.getElementById('video-gallery');
                videos.forEach(video => {
                    // מייצר את הכותרת והנגן עבור כל סרטון
                    const videoHTML = `
                        <div style="margin-bottom: 40px;">
                            <h1>${video.title}</h1>
                            <iframe width="100%" height="400" src="https://www.youtube.com/embed/${video.youtubeId}" title="${video.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    `;
                    gallery.innerHTML += videoHTML;
                });
            })
            .catch(error => console.error('שגיאה בטעינת הסרטונים:', error));
    </script>
</body>
</html>
