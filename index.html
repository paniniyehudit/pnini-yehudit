<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פניני יהודית | הבית הדיגיטלי</title>
    <link rel="icon" type="image/jpeg" href="images/AAA.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <img src="images/GGG.png" class="site-logo">
            <button id="theme-toggle" class="theme-switch" title="מצב לילה/יום">
                <div class="sun-icon">☀️</div>
                <div class="moon-icon">🌙</div>
            </button>
        </div>
        <!-- חיבור הלחצנים לאזורים השונים בעמוד -->
        <nav class="header-bottom">
            <a href="#watch">צפייה</a>
            <a href="#learn">לימוד ותוכן</a>
            <a href="#prayer">תפילה ותהילים</a>
            <a href="#calendar">לוח יהודי</a>
        </nav>
    </header>

    <div class="sticker-banner">
        <img id="rotating-sticker" src="" alt="סטיקר">
    </div>

    <main>
        <!-- אזור לימוד ותוכן -->
        <section id="learn" class="section-container">
            <div id="daily-info-box" class="today-info">טוען עדכון יומי...</div>
        </section>
        
        <!-- אזור צפייה (גלריית הסרטונים) -->
        <section id="watch" class="section-container">
            <h2 style="text-align: right; color: #1a5f7a; border-bottom: 2px solid #1a5f7a; padding-bottom: 10px;">סרטונים אחרונים</h2>
            <div id="video-gallery">
                <!-- הסרטונים יופיעו כאן בצורת רשת -->
            </div>
        </section>

        <!-- אזור תפילה ותהילים (מוכן לעתיד) -->
        <section id="prayer" class="section-container">
            <h2 style="text-align: right; color: #1a5f7a; border-bottom: 2px solid #1a5f7a; padding-bottom: 10px;">תפילה ותהילים</h2>
            <p style="text-align: right;">פרקי התהילים והתפילות היומיות ישולבו כאן בקרוב.</p>
        </section>

        <!-- אזור לוח יהודי (מוכן לעתיד) -->
        <section id="calendar" class="section-container">
            <h2 style="text-align: right; color: #1a5f7a; border-bottom: 2px solid #1a5f7a; padding-bottom: 10px;">לוח יהודי</h2>
            <p style="text-align: right;">לוח שנה עברי וזמני היום ישולבו כאן בקרוב.</p>
        </section>
    </main>

    <footer>
        <p>זמנים באדיבות Hebcal | טקסטים באדיבות Sefaria</p>
        <p>© כל הזכויות שמורות לפניני יהודית</p>
    </footer>

    <script>
        // מצב לילה
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // טקסט יומי
        fetch('daily_text.txt')
            .then(response => response.text())
            .then(text => {
                if(text.trim() !== "") document.getElementById('daily-info-box').innerText = text;
            })
            .catch(error => console.error('שגיאה:', error));

        // סטיקרים
        fetch('stickers.json')
            .then(response => response.json())
            .then(stickers => {
                const stickerImg = document.getElementById("rotating-sticker");
                if (stickers.length > 0) stickerImg.src = stickers[0];
                if (stickers.length > 1) {
                    let currentStickerIndex = 0;
                    setInterval(() => {
                        stickerImg.classList.add("fade-out");
                        setTimeout(() => {
                            currentStickerIndex = (currentStickerIndex + 1) % stickers.length;
                            stickerImg.src = stickers[currentStickerIndex];
                            stickerImg.classList.remove("fade-out");
                        }, 500); 
                    }, 7000);
                }
            })
            .catch(error => console.error('שגיאה:', error));

        // גלריית סרטונים (מעודכן לכרטיסיות)
        fetch('videos.json')
            .then(response => response.json())
            .then(videos => {
                const gallery = document.getElementById('video-gallery');
                videos.forEach(video => {
                    const videoHTML = `
                        <div class="video-card">
                            <h1>${video.title}</h1>
                            <iframe width="100%" height="220" src="https://www.youtube.com/embed/${video.youtubeId}" title="${video.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    `;
                    gallery.innerHTML += videoHTML;
                });
            })
            .catch(error => console.error('שגיאה:', error));
    </script>
</body>
</html>
