<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פניני יהודית | הבית הדיגיטלי</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
       <img src="לוגו.jpeg.jpeg" alt="לוגו פניני יהודית" class="site-logo">
        <nav>
            <a href="#">צפייה</a>
            <a href="#">לימוד ותוכן</a>
            <a href="#">תפילה ותהילים</a>
            <a href="#">לוח יהודי</a>
        </nav>
        <button id="theme-toggle">ירח / שמש 🌙</button>
    </header>

    <main>
        <section class="hero">
            <div class="today-info">היום: מתכוננים לראש השנה | פנינה יומית: "מעט מן האור דוחה הרבה מן החושך"</div>
            
            <h1>הסרטון השבועי</h1>
            <!-- נגן יוטיוב זמני לבדיקה -->
            <iframe width="100%" height="400" src="https://www.youtube.com/embed/ScMzIvxBSi4" title="YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </section>
    </main>

    <footer>
        <p>זמנים באדיבות Hebcal | טקסטים באדיבות Sefaria</p>
        <p>© כל הזכויות שמורות לפניני יהודית</p>
    </footer>

    <script>
        // קוד פשוט למצב לילה
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
