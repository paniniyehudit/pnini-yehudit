<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פניני יהודית | הבית הדיגיטלי</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <img src="images/GGG.png" class="site-logo">
            <button id="theme-toggle" class="theme-switch" title="מצב לילה/יום">
                <div class="sun-icon">☀️</div>
                <div class="moon-icon">🌙</div>
            </button>
        </div>
        <nav class="header-bottom">
            <a href="#">צפייה</a>
            <a href="#">לימוד ותוכן</a>
            <a href="#">תפילה ותהילים</a>
            <a href="#">לוח יהודי</a>
        </nav>
    </header>

    <!-- אזור הסטיקרים המתחלפים -->
    <div class="sticker-banner">
        <img id="rotating-sticker" src="" alt="סטיקר">
    </div>

    <main>
        <section class="hero">
            <!-- האזור של הטקסט היומי שמתעדכן אוטומטית מהקובץ -->
            <div id="daily-info-box" class="today-info">טוען עדכון יומי...</div>
            
            <h1>הסרטון השבועי</h1>
            <!-- נגן יוטיוב זמני לבדיקה -->
            <iframe width="100%" height="400" src="https://www.youtube.com/embed/ScMzIvxBSi4" title="YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </section>
    </main>

    <footer>
        <p>זמנים באדיבות Hebcal | טקסטים באדיבות Sefaria</p>
        <p>© כל הזכויות שמורות לפניני יהודית</p>
    </footer>

    <script>
        // קוד כפתור מצב לילה/יום
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // מנוע ששואב את הטקסט היומי מקובץ הטקסט
        fetch('daily_text.txt')
            .then(response => response.text())
            .then(text => {
                if(text.trim() !== "") {
                    document.getElementById('daily-info-box').innerText = text;
                }
            })
            .catch(error => console.error('שגיאה בטעינת הטקסט היומי:', error));

        // המנוע ששואב את הסטיקרים מקובץ ה-JSON
        fetch('stickers.json')
            .then(response => response.json())
            .then(stickers => {
                const stickerImg = document.getElementById("rotating-sticker");
                
                // מציג את הסטיקר הראשון ברשימה
                if (stickers.length > 0) {
                    stickerImg.src = stickers[0];
                }

                // מתחיל להחליף אם יש יותר מאחד
                if (stickers.length > 1) {
                    let currentStickerIndex = 0;
                    setInterval(() => {
                        stickerImg.classList.add("fade-out"); // אפקט העלמה
                        setTimeout(() => {
                            currentStickerIndex = (currentStickerIndex + 1) % stickers.length;
                            stickerImg.src = stickers[currentStickerIndex];
                            stickerImg.classList.remove("fade-out"); // חזרת התמונה החדשה
                        }, 500); 
                    }, 7000); // מתחלף כל 7 שניות
                }
            })
            .catch(error => console.error('שגיאה בטעינת הסטיקרים:', error));
    </script>
</body>
</html>
